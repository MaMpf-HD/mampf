name: Schedule Deploy Image Rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dispatch-build:
    name: Dispatch deploy image rebuild
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      # Weekly OS-patch rebuild of both live baselines: next -> staging,
      # main -> production. For a one-off single-branch rebuild use
      # `just build ref=<branch>` instead.
      matrix:
        build_ref: [next, main]
    env:
      BUILD_REF: ${{ matrix.build_ref }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Force an OS security refresh so the weekly rebuild actually re-pulls the
      # base image and applies fresh apt security updates, instead of reusing the
      # layer cache (which would rebuild an identical, unpatched image). This is
      # what makes the schedule worth having; build-deploy-image maps the flag to
      # `pull: true` + a cache-busting build-arg.
      - name: Dispatch build-deploy-image workflow on target branch
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-deploy-image.yml/dispatches" \
            --method POST \
            -f "ref=${BUILD_REF}" \
            -f "inputs[os_security_refresh]=true"
