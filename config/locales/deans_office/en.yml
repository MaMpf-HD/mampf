      staff_only: 'only through the teacher'
    unlimited: 'unlimited'
    seats_and_unlimited: '%{seats} + unlimited'
    first_choices:
      one: '1 (first choice)'
      other: '%{count} (first choices)'
    groups_of: 'Groups of %{lecture}'
