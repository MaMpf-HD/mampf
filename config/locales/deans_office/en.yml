    registered: 'Registered'
    members: 'Members'
    registration: 'Registration'
    sections:
      lectures: 'Lectures'
      seminars: 'Seminars'
    legend:
      registration: 'How people get into the group.'
      registered: >-
        Group: confirmed registrations in the running registration; where
        places go by preference, the first choices. Lecture: how many people
        registered for any of its groups, each once, rejected ones left out.
        "–" where no registration is running.
      members: >-
        Group: how many are in the group now. Lecture: how many members the
        lecture has; this can be more or fewer than in its groups together.
      seats: >-
        Group: the most it takes. Lecture: its groups' places added up,
        tutorials, talks and exams together; these are group places, not
        people.
    access:
