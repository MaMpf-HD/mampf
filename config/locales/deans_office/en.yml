en:
  deans_office:
    title: "Dean's office"
    explainer: >-
      Every lecture of a term with its groups: how many seats they have, how
      many have registered and how many members they have so far.
    term: 'Term'
    no_lectures: 'There are no lectures in this term.'
    no_groups: 'none'
    lecture: 'Lecture'
    teacher: 'Teacher'
    groups: 'Groups'
