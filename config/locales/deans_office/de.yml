de:
  deans_office:
    title: 'Dekanat'
    explainer: >-
      Alle Veranstaltungen eines Semesters mit ihren Gruppen: wie viele Plätze
      sie haben, wie viele sich angemeldet haben und wie viele Mitglieder sie
      schon haben.
    term: 'Semester'
    no_lectures: 'In diesem Semester gibt es keine Veranstaltungen.'
    lecture: 'Veranstaltung'
    teacher: 'DozentIn'
    groups: 'Gruppen'
    seats: 'Plätze'
    registered: 'Angemeldet'
    members: 'Mitglieder'
    registration: 'Anmeldung'
    sections:
      lectures: 'Vorlesungen'
      seminars: 'Seminare'
    legend:
      registration: 'Wie man in die Gruppe kommt.'
      registered: >-
        Gruppe: bestätigte Anmeldungen im laufenden Anmeldeverfahren, wo nach
        Präferenzen verteilt wird die Erstwünsche. Veranstaltung: wie viele
        Personen sich für eine ihrer Gruppen angemeldet haben, jede einmal,
        abgelehnte nicht. „–“, wo gerade kein Anmeldeverfahren läuft.
      members: >-
        Gruppe: wie viele jetzt in der Gruppe sind. Veranstaltung: wie viele
        Mitglieder die Veranstaltung hat; das können mehr oder weniger sein als
        in ihren Gruppen zusammen.
      seats: >-
        Gruppe: wie viele sie höchstens aufnimmt. Veranstaltung: die Plätze
        ihrer Gruppen zusammengezählt, Tutorien, Vorträge und Klausuren
        gemeinsam; das sind Gruppenplätze, keine Personen.
    access:
      open: 'läuft bis %{deadline} · %{mode}'
      modes:
        first_come: 'wer zuerst kommt'
        preferences: 'nach Präferenzen'
      allocating: 'geschlossen, Zuteilung steht aus'
      not_open: 'Anmeldung noch nicht geöffnet'
      no_campaign_yet: 'wartet auf ein Anmeldeverfahren'
      self_join: 'Studierende tragen sich selbst ein'
      completed: 'Anmeldung abgeschlossen'
      staff_only: 'nur durch Lehrende'
    unlimited: 'unbegrenzt'
    seats_and_unlimited: '%{seats} + unbegrenzt'
    first_choices:
      one: '1 (Erstwunsch)'
      other: '%{count} (Erstwünsche)'
    groups_of: 'Gruppen von %{lecture}'
    filter: 'Filtern'
    filter_placeholder: 'Veranstaltung oder DozentIn'
    no_match: 'Keine Veranstaltung passt zum Filter.'
    open_all: 'Alle Gruppen zeigen'
    close_all: 'Alle Gruppen ausblenden'
    group: 'Gruppe'
    kind: 'Art'
    kinds:
      tutorial: 'Tutorium'
      talk: 'Vortrag'
      cohort: 'Weitere Gruppe'
      exam: 'Klausur'
