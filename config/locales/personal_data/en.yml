en:
  personal_data:
    title: "Your name and matriculation number"
    lead: >-
      MaMpf now includes what Müsli used to do: exercise classes, exams and
      seminars are organised here. For them we need the name and matriculation
      number the university knows you by. Your display name stays as it is for
      everything else.
    saved_by_support_html: >-
      Your saved name and matriculation number can only be changed by the
      support: %{support}.
    no_matriculation_number: "I do not have a matriculation number yet"
    uni_id_hint: "Optional, e.g. ab123. You can change it yourself at any time."
    confirmation_html: >-
      I have checked these details. After saving, only the support
      (%{support}) can change my name and matriculation number.
    save: "Save"
    saved: "Thank you, your details are saved."
    decline_explanation: >-
      You only use MaMpf for its materials and take part in no exercise class,
      exam or seminar? Then you can skip this. Should you want to take part
      later, you can enter the details on your profile page.
    decline: "I do not take part in exercise classes or exams"
    needed_to_register: >-
      To register, we need your name and matriculation number. Please enter
      them on your profile page first.
    edit_link: "Show or complete"
  activerecord:
    attributes:
      user:
        first_name: "First name"
        last_name: "Last name"
        matriculation_number: "Matriculation number"
        uni_id: "Uni ID"
        personal_data_confirmation: "Confirmation"
