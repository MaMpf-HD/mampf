de:
  personal_data:
    title: "Dein Name und Deine Matrikelnummer"
    lead: >-
      MaMpf übernimmt jetzt, was bisher Müsli gemacht hat: Übungsgruppen,
      Klausuren und Seminare der Fakultät für Mathematik und Informatik der
      Universität Heidelberg werden hier organisiert.
    why: >-
      Dafür brauchen wir den Namen und die Matrikelnummer, unter denen die
      Universität Heidelberg Dich kennt.
    display_name_hint: >-
      So erscheinst Du im Forum, bei Kommentaren und überall dort, wo Dein Name
      aus der Universität nicht gebraucht wird. Bei vielen steht hier noch der
      Anfang ihrer E-Mail-Adresse – eine gute Gelegenheit, ihn zu ändern. Du
      kannst ihn jederzeit in Deinem Profil ändern.
    saved_by_support_html: >-
      Gespeicherten Namen und Matrikelnummer ändert nur der Support: %{support}.
    no_matriculation_number: "Ich habe noch keine Matrikelnummer"
    uni_id_hint: "Optional, z. B. ab123. Du kannst sie jederzeit selbst ändern."
    confirmation_html: >-
      Ich habe die Angaben geprüft. Nach dem Speichern kann nur noch der
      Support (%{support}) meinen Namen und meine Matrikelnummer ändern.
    save: "Speichern"
    saved: "Danke, Deine Angaben sind gespeichert."
    decline_explanation: >-
      Dann brauchen wir nichts von Dir. Nimmst Du später doch teil, kannst Du die
      Angaben in Deinem Profil nachtragen.
    needed_to_register: >-
      Für die Anmeldung brauchen wir Deinen Namen und Deine Matrikelnummer. Trag
      sie bitte zuerst in Deinem Profil ein.
    edit_link: "Ansehen oder ergänzen"
    participation_question: >-
      Nimmst Du als Studentin oder Student an Übungen, Klausuren oder Seminaren
      der Fakultät für Mathematik und Informatik der Universität Heidelberg teil?
    participation_hint: >-
      Lehrende und Mitarbeitende wählen „Nein“. Tutorinnen und Tutoren, die
      selbst studieren, wählen „Ja“.
    participation_yes: "Ja"
    participation_no: "Nein"
    continue: "Weiter"
  activerecord:
    attributes:
      user:
        first_name: "Vorname"
        last_name: "Nachname"
        matriculation_number: "Matrikelnummer"
        uni_id: "Uni-ID"
        personal_data_confirmation: "Bestätigung"
