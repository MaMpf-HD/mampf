        Your registration for “%{lecture}” was rejected. You can keep the
        lecture as a bookmark, or remove it from your dashboard entirely.
      remove_registration_notice_keep_bookmarked: "Keep in bookmarked lectures"
      remove_registration_notice_remove_entirely: "Remove entirely"
    next_term_banner:
      heading:
        one: "Lectures for %{term} are being published — the first one is already in MaMpf."
        other: "Lectures for %{term} are being published — %{count} are already in MaMpf."
      registration_intro: >-
        Course registration can now also happen here in MaMpf (provided the relevant lecture offers this option).
      transition_label: "Under construction"
      transition_notice: >-
        Müsli is heading into retirement. Bye-bye, Müsli! Over the next few weeks, we will be gradually rebuilding
