de:
  main:
    start:
      no_lectures: >-
        Du bist zu keiner Veranstaltung im %{term} angemeldet und hast Dir auch
        keine gemerkt. Scrolle nach unten, um neue Veranstaltungen zu entdecken.
      no_lectures_any_term: >-
        Du bist noch zu keiner Veranstaltung angemeldet und hast Dir auch keine
        gemerkt. Scrolle nach unten, um neue Veranstaltungen zu entdecken.
      sections:
        enrolled: "Für diese bist Du angemeldet"
        bookmarked: "Diese hast Du Dir gemerkt"
      registration_open: "Anmeldung offen — jetzt anmelden"
      remove_bookmark: "Nicht mehr merken"
      remove_bookmark_for: "Nicht mehr merken: %{lecture}"
      remove_bookmark_title: "Nicht mehr merken?"
      remove_bookmark_body: >-
        „%{lecture}“ aus Deinen gemerkten Veranstaltungen entfernen? Du kannst
        sie über die Vorlesungssuche erneut merken.
      remove_bookmark_body_locked: >-
        „%{lecture}“ aus Deinen gemerkten Veranstaltungen entfernen? Sie ist
        durch einen Zugangsschlüssel geschützt, Du musst ihn dann auf der
        Veranstaltungsseite erneut eingeben, um sie zu öffnen.
      remove_entirely_relocks: >-
        Entfernst Du sie ganz, musst Du ihren Zugangsschlüssel erneut eingeben,
        um sie zu öffnen.
      remove_bookmark_confirm: "Entfernen"
      remove_registration_notice: "Ausblenden"
      remove_registration_notice_for: "Hinweis zu %{lecture} ausblenden"
      remove_registration_notice_title: "Hinweis ausblenden?"
      remove_registration_notice_body: >-
        Deine Anmeldung für „%{lecture}“ wurde abgelehnt. Du kannst die
        Veranstaltung weiter gemerkt lassen oder ganz von Deinem Dashboard
        entfernen.
      remove_registration_notice_keep_bookmarked: "Weiter merken"
      remove_registration_notice_remove_entirely: "Ganz entfernen"
