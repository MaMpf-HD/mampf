        toggle: "Group Types"
        title: "Available Group Types"
        intro: "Different group types serve different purposes in your course structure."
        tutorials:
          title: "Tutorials"
          description: "Weekly practice groups. Students are automatically added to the course roster."
        talks:
          title: "Talks"
          description: "Seminar presentations. Speakers are automatically added to the course roster."
        flexible:
          title: "Flexible Groups"
          description: "For various purposes like enrollment groups (for courses without tutorials/talks), demand assessment, waitlists, supplementary groups (e.g., 'repeaters'), or special projects. You can specify whether members should be automatically added to the course roster."
        superset_principle:
          title: "Superset Principle"
          description: "Students always join the course via a group. Tutorials and talks automatically transfer students to the course roster. An additional group to enroll students from tutorials/talks into the lecture is not needed."
        sticky_enrollment:
          title: "Enrollment through groups"
          description: "A student is enrolled while in a tutorial, a talk, a flexible group with enrollment or on an exam list. Whoever loses the last of these is no longer enrolled and is listed under “Left”; flexible groups without enrollment and running registrations stay as they are. Points and admission stay stored and count again once the person has one of these places again."
      phase1:
        title: "1. Choose Your Setup Method"
        campaigns:
          title: "Registration Processes"
          description: "Time-bounded process with rules"
          benefits:
            - "Allocation via preferences or first come, first served"
            - "Enforce eligibility rules (e.g. grades)"
            - "Review registrations before allocation"
            - "Roster entry after deadline"
        skip_campaigns:
          title: "Skip Registration Processes"
          description: "Immediate, direct access"
          benefits:
            - "Direct join only (first come, first served)"
            - "No eligibility checks"
            - "Changes take effect immediately"
            - "Immediate roster entry"
