  home_intro: "<div>Willkommen bei <strong>Algebra 1</strong>!</div><div>Auf dieser
    Seite findest Du alles zur Veranstaltung: das Skript, die Videos zu den einzelnen
    Sitzungen und die Übungsblätter. Die Aufzeichnung steht in der Regel am Abend
    nach der Vorlesung bereit, die Kapitelmarken kommen am Tag darauf dazu.</div><div>Die
    Übungsblätter erscheinen mittwochs und werden bis zum Freitag der Folgewoche abgegeben
    — in Zweiergruppen, direkt hier über MaMpf. Deine Tutorin oder Dein Tutor lädt
    die Korrektur an derselben Stelle wieder hoch.</div>"
