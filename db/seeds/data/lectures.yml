  home_intro: "<div>Diese Seite ist die Anlaufstelle für <strong>Einführung in die
    Geometrie</strong>.</div><div>Fragen zwischendurch stellst Du am besten im Forum
    — dort antworten auch die Tutorinnen und Tutoren. Wichtige Hinweise erscheinen
    als Ankündigung ganz oben; wenn Du die Veranstaltung abonniert hast, bekommst
    Du sie außerdem als Benachrichtigung.</div><div>Das Skript wächst mit der Vorlesung
    mit. Wo etwas unklar bleibt, hilft oft die verlinkte Wiederholung aus dem vorigen
    Semester.</div>"
