  organizational_concept: '<div><strong>Termine</strong></div><div><br></div><ul><li>Vorlesung:
    Mo, Mi 9-11 Uhr im Hörsaal im Mathematikon, INF 205 (Dozent: <a href="https://en.wikipedia.org/wiki/Mickey_Mouse">Mickey
    Mouse</a>)</li><li>Plenarübung: Do 14-16 Uhr in SR A im Mathematikon, INF 205
    (Dozentin: <a href="https://en.wikipedia.org/wiki/Minnie_Mouse">Minnie Mouse</a>)</li><li>Modulprüfung:&nbsp;<ul><li>Erste
    Klausur: Montag, den 30. Februar 2001 von 9.30-11.30 Uhr in SR A+B im Mathematikon,
    INF 205</li><li>Zweite Klausur: Termin wird noch bekanntgegeben&nbsp;</li></ul></li></ul><div><br></div><div><strong>Übungsbetrieb</strong></div><div><br></div><div>Für
    die Zulassung zur Modulklausur ist die erfolgreiche Teilnahme am Übungsbetrieb
    erforderlich. Jeden Montag wird das jeweils neue Aufgabenblatt über MaMpf online
    gestellt. <br>Die Lösungen sollen bis Montag der Folgewoche um 12 Uhr in die dafür
    vorgesehenen Einwurfkästen im Mathematikon abgegeben werden. Zum Besprechen der
    Lösungen und für Fragen zum aktuellen Stoff gibt es Tutorien, die im <a href="https://www.mathi.uni-heidelberg.de/muesli/user/login">MÜSLI</a>
    verwaltet werden. Bitte tragen Sie sich rechtzeitig für diese ein. Die Tutorien
    werden ab der zweiten Vorlesungswoche stattfinden. Die Abgabe der Übungsaufgaben
    ist nachdrücklich in Zweierteams gewünscht.</div><div><br></div><div><strong>Literatur</strong></div><div><br></div><ul><li>G.
    Fischer: <a href="https://link.springer.com/book/10.1007%2F978-3-322-88921-8">Analytische
    Geometrie</a></li><li>H. Kasten, D. Vogel: <a href="http://www.ub.uni-heidelberg.de/cgi-bin/edok?dok=https%3A%2F%2Fdoi.org%2F10.1007%2F978-3-662-57621-2&amp;katkey=68311803">Grundlagen
    der ebenen Geometrie</a></li></ul><div><br></div><div><strong>Prüfungs- und Benotungsregeln</strong></div><div><br></div><ul><li>Zum
    erfolgreichen Absolvieren der Modulprüfung ist das Bestehen einer der beiden Klausuren
    notwendig.</li><li><strong>Klausurzulassung:</strong>&nbsp;<ul><li>Für die Zulassung
    zur <em>ersten Klausur</em> ist die regelmäßige Teilnahme an den Tutorien und
    die erfolgreiche Bearbeitung der Übungsblätter notwendig. Hinreichend für die
    erfolgreiche Bearbeitung ist dabei das Erreichen von 50% der erreichbaren Punkte
    in den Übungsaufgaben.&nbsp;</li><li>Zur <em>zweiten Klausur</em> ist zugelassen,
    wer zur ersten Klausur zugelassen war und diese nicht bestanden hat (sei es durch
    Nicht-Erreichen der nötigen Punktzahl oder durch Nicht-Antreten).</li><li><em>Achtung:</em>
    Wer an der ersten Klausur nicht teilnimmt, verschenkt somit einen Versuch, das
    Modul zu bestehen.</li></ul></li><li><strong>Klausuranmeldung:</strong> Die Anmeldung
    zur Klausur wird im <a href="https://www.mathi.uni-heidelberg.de/muesli/user/login">MÜSLI</a>
    verwaltet und läuft vom 15. Januar 2001&nbsp; bis zum 31. Januar 2001.</li><li><strong>Teilnahme
    an der Modulprüfung:</strong> Wer zur Klausur zugelassen und angemeldet ist, nimmt
    offiziell an der Modulprüfung teil, selbst wenn er/sie an keiner Klausur teilnimmt.
    In letzterem Falle erhält er/sie die Note 5.0.&nbsp;</li><li><strong>Nachprüfung:</strong>
    Für diejenigen, die bei einem der Klausurtermine verhindert waren und bei dem
    anderen nicht bestanden haben, wird die Möglichkeit einer mündlichen oder schriftlichen
    Nachprüfung eingeräumt. "Verhindert" bedeutet dabei verhindert durch Krankheit
    (ärztliches Attest bis eine Woche nach der betreffenden Klausur im Prüfungssekretariat
    nachreichen) oder ähnlich triftige Gründe. <em>Achtung:</em> Wer etwa an der ersten
    Klausur nicht teilnimmt ohne im obigem Sinne verhindert zu sein und die zweite
    Klausur nicht besteht, bekommt keine Möglichkeit zur Nachprüfung. Der erste Versuch
    wurde schlichtweg verschenkt (s.o.).</li><li><strong>Benotung:</strong> Die Note
    für das Modul besteht aus der Note der bestandenen Klausur (oder evtl. gewährte
    Nachprüfung), bzw. der Note 5.0, wenn keine Klausur (oder evtl. gewährte Nachprüfung)
    bestanden wurde.</li></ul>'
