  home_intro: "<div><strong>Lineare Algebra 2</strong></div><div>Der Ablauf ist der
    übliche: zwei Vorlesungen und eine Übung pro Woche, dazu ein Übungsblatt, von
    dem die Hälfte der Punkte zur Klausurzulassung reicht.</div><div>Alles, was Du
    dafür brauchst, steht hier: das Skript unter „Manuskript“, die Aufzeichnungen
    unter „Lektionen“ und die Blätter unter „Übungen“. Die Sprechstunde findet dienstags
    um 14 Uhr statt.</div>"
  vignettes: true
  submission_deletion_date: '2026-10-15'
