  forum_id: 5
  home_intro: "<div><strong>Elementare Zahlentheorie</strong></div><div>Der Ablauf
    ist der übliche: zwei Vorlesungen und eine Übung pro Woche, dazu ein Übungsblatt,
    von dem die Hälfte der Punkte zur Klausurzulassung reicht.</div><div>Alles, was
    Du dafür brauchst, steht hier: das Skript unter „Manuskript“, die Aufzeichnungen
    unter „Lektionen“ und die Blätter unter „Übungen“. Die Sprechstunde findet dienstags
    um 14 Uhr statt.</div>"
  submission_deletion_date: '2026-10-15'
