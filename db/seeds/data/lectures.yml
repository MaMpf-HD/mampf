alg_1_seminar_ws2024:
  course: courses/alg_1
  term: terms/ws_2024
  teacher: users/teacher
  organizational_concept: '<div><strong>Termine</strong></div><div><br></div><ul><li>Seminar:
    Do 14-16 Uhr im SR 4 im Mathematikon, INF 205 (Dozent: <a href="https://en.wikipedia.org/wiki/Mickey_Mouse">Mickey
    Mouse</a>)</li><li>Tutorium: n.V. bei <a href="https://en.wikipedia.org/wiki/Minnie_Mouse">Minnie
    Mouse</a></li><li>Vorbesprechung: Mi, 24. Juli 2019, 13.15 Uhr in SR 3&nbsp; im
    Mathematikon, INF 205</li></ul><div><br></div><div><strong>Vorträge</strong></div><div><br>Im
    Seminar wird jede TeilnehmerIn einen Vortrag halten. Die Vorträge werden bei der
    <strong>Vorbesprechung</strong> vergeben. Ob nach der Vorbesprechung noch Themen
    frei sind, können Sie bei der DozentIn in Erfahrung bringen. Beim Vortrag sollen
    Sie&nbsp; den Ihnen zugewiesenen Stoff in der Ihnen zugewiesenen Zeit behandeln
    - und zwar so, dass jeder dass jeder der Anwesenden davon profitiert. Um das zu
    erreichen, ist es wichtig, dass Sie <em>frühzeitig</em> mit der Vorbereitung Ihres
    Vortrags beginnen. Außerdem erwarten wir, dass Sie rechtzeitig vor dem Vortrag
    Kontakt mit <a href="https://en.wikipedia.org/wiki/Minnie_Mouse">Minnie Mouse</a>
    aufnehmen, um Details zum Inhalt und zur Strukturierung des Vortrags zu besprechen.
    Rechtzeitig wäre beispielsweise zwei Wochen vor Ihrem Vortrag - eine Viertelstunde
    vor Vortragsbeginn ist nicht rechtzeitig. Sie sollten daraufhin arbeiten, sämtliche
    Details ihres Vortragsinhaltes gründlich zu verstehen. Auf der anderen Seite ist
    es wichtig für Ihren Vortrag, dass Sie diesen so gestalten, dass Ihre KommilitonInnen
    - für die der Inhalt Ihres Vortrages in der Regel neu sein wird - eine Chance
    haben, diesen auch zu verstehen. Viele nützliche Hinweise zum Halten mathematischer
    Vorträge finden Sie <a href="http://download.uni-mainz.de/mathematik/Topologie%20und%20Geometrie/Lehre/Wie-halte-ich-einen-Seminarvortrag.pdf">hier</a>.<br><br></div><div><strong>Literatur</strong></div><div><br></div><ul><li>G.
    Fischer: <a href="https://link.springer.com/book/10.1007%2F978-3-322-88921-8">Analytische
    Geometrie</a></li><li>H. Kasten, D. Vogel: <a href="http://www.ub.uni-heidelberg.de/cgi-bin/edok?dok=https%3A%2F%2Fdoi.org%2F10.1007%2F978-3-662-57621-2&amp;katkey=68311803">Grundlagen
    der ebenen Geometrie</a></li></ul><div><br></div><div><strong>Prüfungs- und Benotungsregeln</strong></div><div><br></div><ul><li>Zum
    erfolgreichen Absolvieren der Modulprüfung ist das Bestehen des Vortrags notwendig.</li><li>Die
    Anmeldung zum Vortrag erfolgt über MÜSLI. Die Anmeldung wird am 15. August 2019
    geschlossen. Wer danach noch im MÜSLI für das Seminar eingetragen ist, erhält
    bei Nichtabhalten seines/ihres Vortrags die Note 5 (nicht bestanden).</li><li><strong>Benotung:</strong>
    Die Note für das Modul besteht aus der Note des bestandenen Vortrags, bzw. der
    Note 5.0, wenn der Vortrag nicht bestanden oder nicht abgehalten wurde.</li></ul>'
  released: all
  content_mode: video
  passphrase: key
  locale: en
  sort: seminar
  submission_deletion_date: '2025-04-15'
