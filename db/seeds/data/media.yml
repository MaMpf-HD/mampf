la_2_lecture_ss2026_remark_ideale_in_z_erzeuger_kandidat:
  sort: Remark
  description: Ideale in Z Erzeuger Kandidat
  teachable: lectures/la_2_lecture_ss2026
  released: all
  type: Remark
  text: "Wir können annehmen, dass $I$ nicht das Nullideal ist, da dieses bereits
    ein Hauptideal ist.\nWenn $I$ nicht das Nullideal ist, dann enthält es ein von
    $0$ verschiedenes Element $y$ und damit auch eine natürliche Zahl $\\lvert y \\rvert.$\nInsgesamt
    können wir folgern, dass $I\\cap \\mathbb{N}$ eine nicht-leere Teilmenge der natürlichen
    Zahlen ist und daher ein minimales Element $x$ besitzt. \nUm zu zeigen, dass $x$
    ein Erzeuger von $I$ ist, müssen wir zeigen, dass jedes Element $y \\in I$ von
    der Form $y=ax$ ist für ein $a \\in \\mathbb{Z}.$  Eine wichtige Zutat wird die
    Division mit Rest."
  position: 15
  released_at: '2021-07-24T18:22:40+02:00'
la_2_lecture_ss2026_question_ideale_in_z_division_mit_rest:
  sort: Question
  description: Ideale in Z Division mit Rest
  teachable: lectures/la_2_lecture_ss2026
  released: all
  level: 1
  type: Question
  text: |-
    Sei wie zuvor $0 \neq I\subset \mathbb{Z}$ ein Ideal und $x \in I$ die kleinste natürliche Zahl in $I$. Sei weiterhin $y \in I$ ein weiteres Element. Mit Hilfe von Division mit Rest finden wir ein $a \in \mathbb{Z}$ und ein $0 \leq r < \lvert x\rvert$ mit $$y = ax+r.$$
    Was können wir ableiten?
  independent: false
  solution:
    serialized: |
      --- !ruby/object:Solution
      content: !ruby/object:MampfExpression
        value: '0'
        tex: '0'
        nerd: '0'
  question_sort: mc
  position: 16
  released_at: '2021-07-24T18:23:22+02:00'
  answers_count: 3
la_2_lecture_ss2026_remark_ideale_in_z_final:
  sort: Remark
  description: Ideale in Z final
  teachable: lectures/la_2_lecture_ss2026
  released: all
  type: Remark
  text: 'Damit haben wir gezeigt: Jedes $y \in I$ ist von der Form $y= ax$ für ein
    $a \in \mathbb{Z}.$ Daher wird $I$ von $x$ erzeugt. Essentiell für den Beweis
    war die Division mit Rest. Divison mit Rest ist in jedem $\textbf{``euklidischen
    Ring''''}$ möglich. Die ganzen Zahl sind ein Beispiel eines euklidischen Rings.
    Der Beweis, den wir in diesem Quiz geführt haben, lässt sich auch auf euklidische
    Ringe übertragen. Damit würde man das folgende Ergebnis erhalten: Jeder $\textbf{euklidische
    Ring}$ ist ein $\textbf{Hauptidealring}.$'
  position: 17
  released_at: '2021-07-24T18:24:37+02:00'
