la_2_lecture_ss2026_remark_ideale_in_z_start:
  sort: Remark
  description: Ideale in Z Start
  teachable: lectures/la_2_lecture_ss2026
  released: all
  type: Remark
  text: |-
    In diesem angeleiteten Beweis wollen wir zeigen, dass jedes Ideal in $\mathbb{Z}$ von einem Element erzeugt wird. Ein Ideal $I$ eins (kommutativen) Ringes $R,$ welches von einem Element erzeugt wird, nennt man $\textbf{Hauptideal}.$ In diesem Fall gibt es ein $x \in I,$ sodass für jedes $y\in I$ ein $a \in R$ existiert mit $y = ax.$ Man schreibt dann auch $$I = (x) := Rx = \{ax \mid a\in R\}.$$
    Ein kommutativer nullteilerfreier Ring, in dem jedes Ideal ein Hauptideal ist, wird $\textbf{Hauptidealring}$ genannt. Die ganzen Zahlen $\mathbb{Z}$ sind bekanntlich nullteilerfrei. Wir werden in diesem Quiz folglich zeigen, dass $\mathbb{Z}$ ein Hauptidealring ist.
  position: 11
  released_at: '2021-07-24T18:16:21+02:00'
