la_2_lecture_ss2026_question_zusammenhang_invariantenteiler_und_charakteristisch:
  sort: Question
  description: Zusammenhang Invariantenteiler und charakteristisches Polynom
  teachable: lectures/la_2_lecture_ss2026
  released: all
  level: 1
  type: Question
  text: Die Matrix $A\in M_{5,5}(\mathbb{Q})$ habe die Invariantenteiler $1,1,t-2,(t-2)(t-3),(t-2)(t-3)$.
    Gib das charakteristische Polynom von $A$ (als Polynom aus $\mathbb{Q}[t]$) an.
  independent: true
  solution:
    serialized: |
      --- !ruby/object:Solution
      content: !ruby/object:MampfExpression
